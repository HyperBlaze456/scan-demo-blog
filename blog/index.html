<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>생활 속 데이터 노트</title>
<style type="text/css">
html { width: 100%; height: 100%; }
body { width: 100%; height: 100%; margin: 0; padding: 0; font-size: 0; }
#mainFrame { width: 100%; height: 100%; margin: 0; padding: 0; border: 0; }
.blind { position: absolute; overflow: hidden; clip: rect(0 0 0 0); width: 1px; height: 1px; margin: -1px; }
</style>
</head>
<body>
<iframe id="mainFrame" name="mainFrame" allowfullscreen="true" src="PostView.html?blogId=datanote_jigi&amp;logNo=224460210384&amp;redirect=Dlog&amp;widgetTypeCall=true&amp;noTrackingCode=true&amp;directAccess=false" scrolling="auto"></iframe>
<p class="blind">이 페이지는 확장 프로그램 시연을 위해 만든 가상의 화면입니다. 글, 닉네임, 번호는 모두 지어낸 것입니다.</p>
<script>
// The outer page takes its title from the post page inside the frame.
(function () {
  var frame = document.getElementById("mainFrame");
  frame.addEventListener("load", function () {
    try { if (frame.contentDocument && frame.contentDocument.title) document.title = frame.contentDocument.title; } catch (e) {}
  });
})();
</script>
</body>
</html>
